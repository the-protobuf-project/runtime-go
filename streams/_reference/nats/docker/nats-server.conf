# NATS Server Configuration with WebSocket Support

# Client port
port: 4222

# HTTP monitoring port
http_port: 8222

# Enable JetStream
jetstream {
  store_dir: /data
}

# WebSocket configuration for browser clients
websocket {
  port: 8080
  no_tls: true
}

# Optional: Enable TLS for secure WebSocket (wss://)
# Uncomment and configure certificates if needed
# websocket {
#   port: 443
#   tls {
#     cert_file: "/path/to/cert.pem"
#     key_file: "/path/to/key.pem"
#   }
# }
