services:
  redis:
    image: redis:latest
    container_name: redis-local
    ports:
      - "6379:6379"
    # Bind mount host directory so Redis RDB files persist on host
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The one backend in this module with no embeddable Go server, so its tests
  # skip without this running. Kafka, NATS and MQTT all start in-process.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-local
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10