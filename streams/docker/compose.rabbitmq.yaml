# RabbitMQ for rabbitmq/rabbitmq_live_test.go (build tag live).
#
#   docker compose -p tpp-streams-live-rabbitmq -f docker/compose.rabbitmq.yaml up -d --wait
#   RABBITMQ_TEST_URL=amqp://guest:guest@127.0.0.1:15682/ \
#   RABBITMQ_TEST_MANAGEMENT=http://127.0.0.1:15683 \
#     go test -race -tags live ./rabbitmq/...
#   docker compose -p tpp-streams-live-rabbitmq -f docker/compose.rabbitmq.yaml down -v
#
# The live tests default to 15682 on their own. The two variables point the
# untagged tests, which compile alongside them and default to 5672 for CI, at
# this broker too.
#
# Host ports are in the 15xxx range so this can run beside a RabbitMQ already
# listening on 5672/15672, and beside the other backends' compose files.
services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: tpp-streams-rabbitmq
    # With an empty data directory the entrypoint runs as root and leaves a
    # root-owned .erlang.cookie the server cannot read once it drops privileges.
    # Running as the rabbitmq user throughout makes the writer and the reader
    # the same, as in compose.yaml.
    user: rabbitmq
    ports:
      - "127.0.0.1:15682:5672"  # AMQP
      - "127.0.0.1:15683:15672" # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: "no"
