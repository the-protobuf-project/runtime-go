version: 2

# One entry per workspace module, because Dependabot keys updates on a
# directory containing a go.mod and go.work does not make it look inside.
# The list must track go.work: an entry naming a directory that no longer
# exists fails its update run every week, and a module missing from the list
# is silently never updated at all. Both had happened -- /config,
# /resourcename and /system were failing runs, and eleven live modules were
# getting nothing.
#
# Updates are grouped so one run produces one pull request per module rather
# than one per dependency. With auto-merge enabled (see
# .github/workflows/dependabot-auto-merge.yml) that is the difference between
# a handful of merges a week and several dozen.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /agents
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps/agents)"
    labels:
      - dependencies
    groups:
      agents:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /blockchain
