name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  # ------------------------------------------------------------------
  # Detect which workspace modules exist so we can fan-out per module.
  # ------------------------------------------------------------------
  detect-modules:
    name: Detect modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse go.work and emit matrix
        id: set-matrix
        run: |
          # Extract module directories from go.work, skip lines that aren't paths
          modules=$(grep -E '^\s+\./[a-z]' go.work | tr -d ' \t' | sed 's|^\./||')
          # Filter to only directories that actually have a go.mod
          valid=()
          for m in $modules; do
            if [ -f "$m/go.mod" ]; then
              valid+=("$m")
            fi
          done
          # Build JSON array
          json=$(printf '%s\n' "${valid[@]}" | jq -R . | jq -cs .)
          echo "matrix={\"module\":$json}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build and test every module in parallel.
  # ------------------------------------------------------------------
  test:
    name: Test (${{ matrix.module }})
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-modules.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # The streams Redis and RabbitMQ providers' tests skip without a live
      # server, so without this they report success having run nothing. The
      # Kafka, NATS and MQTT suites start their brokers in-process and need
      # nothing here.
      #
      # Service containers would be the usual way, but the scheduled-delivery
      # suite needs `--notify-keyspace-events Ex` and services cannot override a
      # container's command. Conditioning on the module keeps the other jobs
      # from paying for servers they do not use.
      - name: Start Redis and RabbitMQ
        if: matrix.module == 'streams'
        run: |
          docker run -d --name redis -p 6379:6379 redis:latest \
            redis-server --notify-keyspace-events Ex

          # --user rabbitmq is load-bearing. The image declares
          # VOLUME /var/lib/rabbitmq; where that mount comes up empty rather
          # than populated from the image, the entrypoint runs as root, Erlang
          # creates a root-owned 0400 .erlang.cookie, and the server then drops
          # to the rabbitmq user and cannot read its own cookie — the node dies
          # at prelaunch with "Error when reading .erlang.cookie: eacces".
          # Running as that user throughout makes the writer and the reader the
          # same. Reproduced locally with --tmpfs on the same path.
          docker run -d --name rabbitmq --user rabbitmq -p 5672:5672 rabbitmq:4

          ready() {
            docker exec redis redis-cli ping >/dev/null 2>&1 &&
            docker exec rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1
          }
          # RabbitMQ boots the Erlang VM first, so this is slower than Redis.
          for _ in $(seq 1 60); do
            if ready; then
              echo "Redis and RabbitMQ are ready"
              exit 0
            fi
            sleep 2
          done
          echo "a broker did not become ready in 120s" >&2
          docker logs rabbitmq 2>&1 | tail -20
          exit 1

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -timeout 120s -coverprofile=coverage.out -covermode=atomic

      # Artifact names may not contain "/", so flatten nested module paths
      # (e.g. database/examples -> database-examples).
      - name: Coverage artifact name
        id: coverage-name
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: echo "name=coverage-${MODULE//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.coverage-name.outputs.name }}
          path: ${{ matrix.module }}/coverage.out
          retention-days: 7

  # ------------------------------------------------------------------
  # Lint — runs golangci-lint across every module.
  # ------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.module }})
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-modules.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Sync workspace
        run: go work sync

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  # ------------------------------------------------------------------
  # Docs — every package must carry a doc.go, and the README package
  # table (generated by tools/docgen) must be up to date. Runs on every
  # push/PR and fails if a doc.go is missing or the README is stale.
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate doc.go presence + README freshness
        run: make docs-check

  # ------------------------------------------------------------------
  # Single status gate that PRs can require before merge.
  # ------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [test, lint, docs]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.docs.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
