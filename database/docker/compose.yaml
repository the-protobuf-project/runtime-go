# Backends the interfaces module tests against.
#
# Mongo runs as a single-node replica set rather than standalone, because
# transactions and change streams are both replica-set features — a standalone
# server would make store.Transactional and store.Watcher untestable here and
# quietly different in production.
services:
  mongodb:
    image: mongo:7
    container_name: interfaces-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  arangodb:
    image: arangodb:3.12
    container_name: interfaces-arango
    environment:
      ARANGO_ROOT_PASSWORD: root
    ports:
      - "8529:8529"

  redis:
    image: redis:7
    container_name: interfaces-redis
    ports:
      - "6379:6379"

  # TimescaleDB is PostgreSQL with a time-series extension, so the SQL driver
  # already speaks to it — what the timescale package adds is the part that is
  # not SQL: hypertables, time buckets and retention.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: interfaces-timescale
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runtime
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The SQL dialects the orm driver claims to support. SQLite runs in-process
  # and needs no container, so these two are what actually exercise the
  # dialect-specific paths — identifier quoting and column types — that a
  # SQLite-only suite cannot reach.
  postgres:
    image: postgres:16
    container_name: interfaces-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runtime
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    container_name: interfaces-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: runtime
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 30
